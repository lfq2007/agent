server: # 服务器元数据
  name: YA_MCPServer_TravelAssistant
  name_zh: YA 智能旅游助手
  author: 程桦杰
  description: A travel assistant MCP server that provides weather, attractions and hotel information.
  description_zh: 智能旅游助手 MCP 服务器，提供天气查询、景点搜索和酒店推荐功能。
  version: 1.0.0

transport: # 服务器启动方式配置
  type: "sse" # 可选值: stdio, sse
  host: "127.0.0.1" # 仅在 type 为 sse 时有效，表示监听地址，默认为 0.0.0.0
  port: 12346 # 仅在 type 为 sse 时有效，表示监听端口，默认为 12345

logging: # 日志配置
  console:
    enabled: true
    level: "DEBUG"
  file:
    enabled: true
    level: "DEBUG"
    path: "logs/%Y-%m-%d_%H-%M-%S.log"
    rotation: "10 MB"
    retention: "7 days"
    compression: "zip"
